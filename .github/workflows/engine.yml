name: AGI Main

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: agi-main
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .state_cache
          key: agi-state
          restore-keys: |
            agi-state
            state-tune-
            state-

     - name: Run engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MIN_CONFLUENCE_SCORE: '60'
          MIN_PRECISION_SCORE: '70'
          MIN_SIGNAL_GRADE: 'A++'
        run: python quant_engine.py

      - name: Save state
        if: always()
        uses: actions/cache@v4
        with:
          path: .state_cache
          key: agi-state
