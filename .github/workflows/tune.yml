name: Weekly Auto-Tune

on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .state_cache
          key: state-tune-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Run auto-tuner
        run: python auto_tuner.py --deriv --days 60 --out .state_cache/tuned_params.json

      - name: Save state
        uses: actions/cache@v4
        with:
          path: .state_cache
          key: state-tune-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tuned-params-${{ github.run_number }}
          path: .state_cache/tuned_params.json
          retention-days: 30
