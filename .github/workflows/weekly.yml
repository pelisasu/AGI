name: Weekly Report

on:
  schedule:
    # Setiap Minggu 06:00 UTC (13:00 WIB)
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .state_cache
          key: state-weekly-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Send weekly report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os, json
          from agi_gemini import build_weekly_report, format_weekly
          from telegram_utils import send_text, send_photo

          try:
              with open('.state_cache/trade_journal.json') as f:
                  journal = json.load(f)
          except Exception:
              journal = []

          tok = os.getenv('TELEGRAM_BOT_TOKEN', '')
          key = os.getenv('GEMINI_API_KEY', '')
          report = build_weekly_report(journal, api_key=key)
          text = format_weekly(report)
          chart = report.get('chart')
          if chart and os.path.exists(chart):
              send_photo(tok, text, chart)
          else:
              send_text(tok, text, None)
          print('Weekly report sent.')
          "
